<div class="auth-wrapper">
  <div class="container">
    <div class="row">
      <div class="col-md-8 mx-auto">
        <div class="auth-card-container">
          <div class="login-card">

            <div class="ct_auth_white_bg">
              <!-- Header -->
              <div class="auth-page-header">
                <h2 class="auth-title">Create Password</h2>
                <p class="auth-subtitle">Please set a secure, custom password for your account.</p>
              </div>

              <!-- Alert Messages (Success/Error) -->
              <div *ngIf="errorMessage" class="alert alert-danger custom-alert" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i> {{ errorMessage }}
              </div>
              <div *ngIf="successMessage" class="alert alert-success custom-alert" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i> {{ successMessage }}
              </div>

              <!-- Create Password Form -->
              <form [formGroup]="createPasswordForm" (ngSubmit)="onSubmit()" novalidate>

                <!-- New Password Input Group -->
                <div class="form-group mb-4">
                  <label for="password" class="form-label">New Password</label>
                  <div class="input-container">
                    <input [type]="showNewPassword ? 'text' : 'password'" id="password" formControlName="password"
                      class="form-control-custom" placeholder="••••••••"
                      [ngClass]="{ 'is-invalid-custom': (f['password'].invalid && (f['password'].dirty || f['password'].touched || submitted)) }"
                      [attr.disabled]="isLoading ? true : null" />
                    <button type="button" class="password-toggle-btn" (click)="toggleNewPasswordVisibility()"
                      aria-label="Toggle password visibility">
                      <i class="fa-regular" [ngClass]="showNewPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                  </div>
                  <!-- Validation Messages -->
                  <div *ngIf="f['password'].invalid && (f['password'].dirty || f['password'].touched || submitted)"
                    class="error-msg">
                    <span *ngIf="f['password'].errors?.['required']">
                      <i class="fa-solid fa-circle-info me-1"></i> Password is required
                    </span>
                    <span *ngIf="f['password'].errors?.['minlength']">
                      <i class="fa-solid fa-circle-info me-1"></i> Password must be at least 6 characters long
                    </span>
                  </div>
                </div>

                <!-- Confirm Password Input Group -->
                <div class="form-group mb-5">
                  <label for="confirmPassword" class="form-label">Confirm Password</label>
                  <div class="input-container">
                    <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" formControlName="confirmPassword"
                      class="form-control-custom" placeholder="••••••••"
                      [ngClass]="{ 'is-invalid-custom': (f['confirmPassword'].invalid && (f['confirmPassword'].dirty || f['confirmPassword'].touched || submitted)) }"
                      [attr.disabled]="isLoading ? true : null" />
                    <button type="button" class="password-toggle-btn" (click)="toggleConfirmPasswordVisibility()"
                      aria-label="Toggle password visibility">
                      <i class="fa-regular" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                  </div>
                  <!-- Validation Messages -->
                  <div *ngIf="f['confirmPassword'].invalid && (f['confirmPassword'].dirty || f['confirmPassword'].touched || submitted)"
                    class="error-msg">
                    <span *ngIf="f['confirmPassword'].errors?.['required']">
                      <i class="fa-solid fa-circle-info me-1"></i> Please confirm your password
                    </span>
                    <span *ngIf="f['confirmPassword'].errors?.['passwordMismatch']">
                      <i class="fa-solid fa-circle-info me-1"></i> Passwords do not match
                    </span>
                  </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-btn-primary w-100" [disabled]="isLoading || createPasswordForm.invalid">
                  <span *ngIf="!isLoading">Create Password</span>
                  <span *ngIf="isLoading" class="spinner-container">
                    <span class="spinner-border spinner-border-sm role-status-spinner me-2" role="status" aria-hidden="true"></span>
                    Creating...
                  </span>
                </button>
              </form>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
