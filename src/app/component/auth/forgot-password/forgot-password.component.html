<div class="auth-wrapper">
  <div class="container">
    <div class="row">
      <div class="col-md-8 mx-auto">
        <div class="auth-card-container">
          <div class="login-card w-100">

            <div class="ct_auth_white_bg">
              <!-- Brand Header -->
              <div class="auth-page-header">
                <h2 class="auth-title">Lost your password?</h2>
                <p class="auth-subtitle">Enter your email address to reset your password</p>
              </div>

              <!-- Alert Messages (Success/Error) -->
              <div *ngIf="errorMessage" class="alert alert-danger custom-alert" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i> {{ errorMessage }}
              </div>
              <div *ngIf="successMessage" class="alert alert-success custom-alert" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i> {{ successMessage }}
              </div>

              <!-- Reset Form -->
              <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
                <div class="form-group mb-4">
                  <label for="email" class="form-label">Email Address</label>
                  <div class="input-container">
                    <input type="email" id="email" formControlName="email" class="form-control-custom"
                      placeholder="name@example.com"
                      [ngClass]="{ 'is-invalid-custom': (f['email'].invalid && (f['email'].dirty || f['email'].touched || submitted)) }"
                      [attr.disabled]="isLoading ? true : null" />
                  </div>
                  <!-- Validation Messages -->
                  <div *ngIf="f['email'].invalid && (f['email'].dirty || f['email'].touched || submitted)"
                    class="error-msg">
                    <span *ngIf="f['email'].errors?.['required']">
                      <i class="fa-solid fa-circle-info me-1"></i> Email is required
                    </span>
                    <span *ngIf="f['email'].errors?.['email']">
                      <i class="fa-solid fa-circle-info me-1"></i> Please enter a valid email address
                    </span>
                  </div>
                </div>

                <button type="submit" class="auth-btn-primary w-100 mt-4" [disabled]="isLoading || forgotPasswordForm.invalid">
                  <span *ngIf="!isLoading">Submit</span>
                  <span *ngIf="isLoading" class="spinner-container">
                    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                    Submitting...
                  </span>
                </button>
              </form>

            </div>

            <!-- Login footer redirect -->
            <div class="auth-footer mt-4">
              Already know your password? <a routerLink="/login" class="auth-link">Login</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
