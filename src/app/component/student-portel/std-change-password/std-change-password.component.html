<div class="ct_px_28 mt-4">
  <div class="page-header mb-4">
    <h2 class="page-title">Change Password</h2>
    <p class="page-subtitle">Manage and update your account password securely.</p>
  </div>

  <!-- Alert Messages -->
  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="alert alert-success" role="alert">
    {{ successMessage }}
  </div>

  <div>
    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" novalidate class="password-form">
      <div class="dashboard-card p-4 form-card">

        <!-- Current Password -->
        <div class="form-group mb-4">
          <label for="currentPassword" class="form-label">Current Password</label>
          <div class="input-container">
            <input [type]="showCurrentPassword ? 'text' : 'password'" id="currentPassword"
              formControlName="currentPassword" class="form-control-custom pe-5" placeholder="••••••••"
              [ngClass]="{ 'is-invalid': (f['currentPassword'].invalid && (f['currentPassword'].dirty || f['currentPassword'].touched || submitted)) }" />
            <button type="button" class="password-toggle-btn" (click)="toggleCurrentPassword()"
              aria-label="Toggle password visibility">
              <i class="fa-regular" [ngClass]="showCurrentPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
            </button>
          </div>
          <div
            *ngIf="f['currentPassword'].invalid && (f['currentPassword'].dirty || f['currentPassword'].touched || submitted)"
            class="text-danger mt-1 small">
            Current password is required
          </div>
        </div>

        <!-- New Password -->
        <div class="form-group mb-4">
          <label for="newPassword" class="form-label">New Password</label>
          <div class="input-container">
            <input [type]="showNewPassword ? 'text' : 'password'" id="newPassword" formControlName="newPassword"
              class="form-control-custom pe-5" placeholder="••••••••"
              [ngClass]="{ 'is-invalid': (f['newPassword'].invalid && (f['newPassword'].dirty || f['newPassword'].touched || submitted)) }" />
            <button type="button" class="password-toggle-btn" (click)="toggleNewPassword()"
              aria-label="Toggle password visibility">
              <i class="fa-regular" [ngClass]="showNewPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
            </button>
          </div>
          <div *ngIf="f['newPassword'].invalid && (f['newPassword'].dirty || f['newPassword'].touched || submitted)"
            class="text-danger mt-1 small">
            <span *ngIf="f['newPassword'].errors?.['required']">New password is required</span>
            <span *ngIf="f['newPassword'].errors?.['minlength']">Password must be at least 6 characters long</span>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group mb-5">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div class="input-container">
            <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword"
              formControlName="confirmPassword" class="form-control-custom pe-5" placeholder="••••••••"
              [ngClass]="{ 'is-invalid': ((f['confirmPassword'].invalid || changePasswordForm.errors?.['mismatch']) && (f['confirmPassword'].dirty || f['confirmPassword'].touched || submitted)) }" />
            <button type="button" class="password-toggle-btn" (click)="toggleConfirmPassword()"
              aria-label="Toggle password visibility">
              <i class="fa-regular" [ngClass]="showConfirmPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
            </button>
          </div>
          <div
            *ngIf="((f['confirmPassword'].invalid || changePasswordForm.errors?.['mismatch']) && (f['confirmPassword'].dirty || f['confirmPassword'].touched || submitted))"
            class="text-danger mt-1 small">
            <span *ngIf="f['confirmPassword'].errors?.['required']">Please confirm your new password</span>
            <span
              *ngIf="!f['confirmPassword'].errors?.['required'] && changePasswordForm.errors?.['mismatch']">Passwords do
              not match</span>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-3 mt-4">
        <button type="reset" class="portal-btn portal-btn-outline px-4" (click)="cancel()"
          [disabled]="isLoading">Cancel</button>
        <button type="submit" class="portal-btn portal-btn-primary px-4"
          [disabled]="isLoading || changePasswordForm.invalid">
          <span *ngIf="!isLoading">Save Changes</span>
          <span *ngIf="isLoading">Saving...</span>
        </button>
      </div>
    </form>
  </div>
</div>
