<div class="ct_px_28 profile-container pb-5">
  <div class="mb-3 pt-2">
    <a routerLink="/student/my-profile" class="back-link">
      <i class="fa-solid fa-angle-left me-1"></i> Back to Profile
    </a>
  </div>

  <!-- Alert Messages (Success/Error) -->
  <div *ngIf="errorMessage" class="alert alert-danger custom-alert mb-4" role="alert">
    <i class="fa-solid fa-circle-exclamation me-2"></i> {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="alert alert-success custom-alert mb-4" role="alert">
    <i class="fa-solid fa-circle-check me-2"></i> {{ successMessage }}
  </div>

  <div class="profile-banner-card mb-4">
    <div class="banner-img-container">
      <img src="assets/img/mosque.png" alt="" class="banner-img"
        onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(135deg, #E2D3C4 0%, #B8A08E 100%)';" />
    </div>
    <div class="profile-avatar-section">
      <div class="avatar-wrapper">
        <img [src]="getAvatarUrl(currentAvatarUrl)" alt="Profile" class="avatar-img" />
      </div>
      <input type="file" id="avatarFileInput" style="display: none;" (change)="onFileChange($event)" accept="image/*" />
      <button type="button" class="portal-btn portal-btn-outline change-photo-btn ct_orange_outline"
        (click)="triggerFileInput()">
        <i class="fa-solid fa-camera me-2"></i> Change Photo
      </button>
    </div>
  </div>

  <form [formGroup]="editProfileForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="dashboard-card form-card mb-4">
      <div class="p-4">
        <h3 class="section-title mb-4">Student Information</h3>
        <div class="row g-4">
          <!-- First Name -->
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">First Name</label>
              <input type="text" formControlName="firstName" class="form-control-custom"
                [ngClass]="{ 'is-invalid': (f['firstName'].invalid && (f['firstName'].dirty || f['firstName'].touched || submitted)) }"
                [attr.disabled]="isLoading ? true : null" />
              <div *ngIf="f['firstName'].invalid && (f['firstName'].dirty || f['firstName'].touched || submitted)"
                class="text-danger mt-1 small">
                First Name is required
              </div>
            </div>
          </div>
          <!-- Last Name -->
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Last Name</label>
              <input type="text" formControlName="lastName" class="form-control-custom"
                [ngClass]="{ 'is-invalid': (f['lastName'].invalid && (f['lastName'].dirty || f['lastName'].touched || submitted)) }"
                [attr.disabled]="isLoading ? true : null" />
              <div *ngIf="f['lastName'].invalid && (f['lastName'].dirty || f['lastName'].touched || submitted)"
                class="text-danger mt-1 small">
                Last Name is required
              </div>
            </div>
          </div>
          <!-- Grade Level -->
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Class / Grade Level</label>
              <select formControlName="gradeLevel" class="form-control-custom form-select-custom"
                [ngClass]="{ 'is-invalid': (f['gradeLevel'].invalid && (f['gradeLevel'].dirty || f['gradeLevel'].touched || submitted)) }"
                [attr.disabled]="isLoading ? true : null">
                <option value="" disabled>Select Grade Level</option>
                <option *ngFor="let option of gradeOptions" [value]="option">{{ option }}</option>
              </select>
              <div *ngIf="f['gradeLevel'].invalid && (f['gradeLevel'].dirty || f['gradeLevel'].touched || submitted)"
                class="text-danger mt-1 small">
                Grade Level is required
              </div>
            </div>
          </div>
          <!-- DOB -->
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Date of Birth</label>
              <input type="date" formControlName="dob" class="form-control-custom"
                [ngClass]="{ 'is-invalid': (f['dob'].invalid && (f['dob'].dirty || f['dob'].touched || submitted)) }"
                [attr.disabled]="isLoading ? true : null" />
              <div *ngIf="f['dob'].invalid && (f['dob'].dirty || f['dob'].touched || submitted)"
                class="text-danger mt-1 small">
                Date of Birth is required
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Parent Info Section (Read-only for Students) -->
    <div class="dashboard-card form-card mb-4 opacity-75">
      <div class="p-4">
        <h3 class="section-title mb-4">Parent Information <span
            class="badge bg-secondary ms-2 text-white small">Read-Only</span></h3>
        <div class="row g-4">
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control-custom bg-light" value="Ahmed" disabled />
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control-custom bg-light" value="Khan" disabled />
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control-custom bg-light" value="ahmed.khan@email.com" disabled />
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Phone Number</label>
              <input type="text" class="form-control-custom bg-light" value="+1 (610) 555-4587" disabled />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-3 mt-4 mb-4">
      <button type="button" routerLink="/student/my-profile" class="portal-btn portal-btn-outline px-4"
        [disabled]="isLoading">Cancel</button>
      <button type="submit" class="portal-btn portal-btn-primary px-4"
        [disabled]="isLoading || editProfileForm.invalid">
        <span *ngIf="!isLoading">Save Changes</span>
        <span *ngIf="isLoading">Saving...</span>
      </button>
    </div>
  </form>
</div>

<!-- CROP MODAL OVERLAY -->
<div class="crop-modal-backdrop" *ngIf="showCropModal" (click)="cancelCrop()">
  <div class="crop-modal-card" (click)="$event.stopPropagation()">
    <div class="crop-modal-header">
      <h3 class="crop-modal-title">Crop Profile Photo</h3>
      <button class="crop-modal-close" (click)="cancelCrop()">&times;</button>
    </div>

    <div class="crop-modal-body">
      <!-- Crop container circle -->
      <div class="crop-box-container" (mousedown)="onDragStart($event)" (mousemove)="onDragMove($event)"
        (mouseup)="onDragEnd()" (mouseleave)="onDragEnd()" (touchstart)="onDragStart($event)"
        (touchmove)="onDragMove($event)" (touchend)="onDragEnd()">
        <img [src]="imageSrc" id="crop-target-img"
          [style.transform]="'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')'" alt="To Crop"
          class="crop-image-preview-img" />
        <div class="crop-circle-overlay"></div>
      </div>

      <!-- Zoom slider -->
      <div class="zoom-slider-container mt-4">
        <label for="zoomRange" class="form-label">Zoom</label>
        <input type="range" id="zoomRange" class="form-range w-100" min="1" max="3" step="0.05" [(ngModel)]="scale" />
      </div>
    </div>

    <div class="crop-modal-footer">
      <button type="button" class="portal-btn portal-btn-outline px-4" (click)="cancelCrop()">Cancel</button>
      <button type="button" class="portal-btn portal-btn-primary px-4" (click)="cropAndSave()">Save Crop</button>
    </div>
  </div>
</div>
