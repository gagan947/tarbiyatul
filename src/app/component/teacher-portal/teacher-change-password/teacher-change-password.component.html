<div class="ct_px_28 profile-container pb-5 pt-3">
  
  <div class="mb-4 pt-2">
    <h4 class="mb-1 ct_fs_20 ct_fw_600 ct_ff_inter" style="color: #000;">Change Password </h4>
    <p class="text-muted mb-0" style="font-size: 16px;">Update your account password to keep your account secure</p>
  </div>

  <!-- Alert Messages -->
  <div *ngIf="errorMessage" class="alert alert-danger mb-4" role="alert">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" class="alert alert-success mb-4" role="alert">
    {{ successMessage }}
  </div>

  <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="dashboard-card dash-card-shadow ct_p_32 bg-white" style="border-radius: 16px; box-shadow: 0px 1px 10px 0px #061F611F;">
      
      <div class="row mb-4">
        <!-- Current Password -->
        <div class="col-md-12 mb-3">
          <div class="form-group">
            <label for="currentPassword" class="ct_form_label ct_fs_13 ct_fw_600 ct_text_dark mb-2">Current Password</label>
            <div class="position-relative">
              <input 
                [type]="showCurrentPassword ? 'text' : 'password'" 
                id="currentPassword"
                formControlName="currentPassword"
                class="form-control ct_custom_input ct_pe_40"
                placeholder="Enter current password" 
                [ngClass]="{ 'is-invalid': (f['currentPassword'].invalid && (f['currentPassword'].dirty || f['currentPassword'].touched || submitted)) }"
              />
              <i class="fa-solid ct_show_eye" [ngClass]="showCurrentPassword ? 'fa-eye' : 'fa-eye-slash'" (click)="toggleCurrentPassword()" style="cursor: pointer;"></i>
            </div>
            <div *ngIf="f['currentPassword'].invalid && (f['currentPassword'].dirty || f['currentPassword'].touched || submitted)" class="text-danger mt-1 small">
              Current password is required
            </div>
          </div>
        </div>

        <!-- New Password -->
        <div class="col-md-12 mb-3">
          <div class="form-group">
            <label for="newPassword" class="ct_form_label ct_fs_13 ct_fw_600 ct_text_dark mb-2">New Password</label>
            <div class="position-relative">
              <input 
                [type]="showNewPassword ? 'text' : 'password'" 
                id="newPassword"
                formControlName="newPassword"
                class="form-control ct_custom_input ct_pe_40"
                placeholder="Enter new password" 
                [ngClass]="{ 'is-invalid': (f['newPassword'].invalid && (f['newPassword'].dirty || f['newPassword'].touched || submitted)) }"
              />
              <i class="fa-solid ct_show_eye" [ngClass]="showNewPassword ? 'fa-eye' : 'fa-eye-slash'" (click)="toggleNewPassword()" style="cursor: pointer;"></i>
            </div>
            <div *ngIf="f['newPassword'].invalid && (f['newPassword'].dirty || f['newPassword'].touched || submitted)" class="text-danger mt-1 small">
              <span *ngIf="f['newPassword'].errors?.['required']">New password is required</span>
              <span *ngIf="f['newPassword'].errors?.['minlength']">Password must be at least 6 characters long</span>
            </div>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="col-md-12 mb-3">
          <div class="form-group">
            <label for="confirmPassword" class="ct_form_label ct_fs_13 ct_fw_600 ct_text_dark mb-2">Confirm Password</label>
            <div class="position-relative">
              <input 
                [type]="showConfirmPassword ? 'text' : 'password'" 
                id="confirmPassword"
                formControlName="confirmPassword"
                class="form-control ct_custom_input ct_pe_40"
                placeholder="Confirm your password" 
                [ngClass]="{ 'is-invalid': ((f['confirmPassword'].invalid || changePasswordForm.errors?.['mismatch']) && (f['confirmPassword'].dirty || f['confirmPassword'].touched || submitted)) }"
              />
              <i class="fa-solid ct_show_eye" [ngClass]="showConfirmPassword ? 'fa-eye' : 'fa-eye-slash'" (click)="toggleConfirmPassword()" style="cursor: pointer;"></i>
            </div>
            <div *ngIf="((f['confirmPassword'].invalid || changePasswordForm.errors?.['mismatch']) && (f['confirmPassword'].dirty || f['confirmPassword'].touched || submitted))" class="text-danger mt-1 small">
              <span *ngIf="f['confirmPassword'].errors?.['required']">Please confirm your new password</span>
              <span *ngIf="!f['confirmPassword'].errors?.['required'] && changePasswordForm.errors?.['mismatch']">Passwords do not match</span>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="d-flex justify-content-end gap-3 mt-5">
      <button type="button" class="portal-btn text-warning px-4 fw-medium" style="background-color: transparent; border: 1px solid #FC800A; border-radius: 8px; color: #FC800A !important;" (click)="cancel()" [disabled]="isLoading">
        Cancel
      </button>
      <button type="submit" class="portal-btn ct_gradient_btn px-4" style="border-radius: 8px;" [disabled]="isLoading || changePasswordForm.invalid">
        <span *ngIf="!isLoading">Save Changes</span>
        <span *ngIf="isLoading">Saving...</span>
      </button>
    </div>
  </form>

</div>
